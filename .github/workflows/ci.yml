name: CI — TIMI STEMI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Python syntax validation
        run: python -m compileall -q timi_stemi.py cli.py agents tests test_timi_stemi.py
      - name: Test suite
        run: python -m pytest -q
      - name: HMAC audit smoke check
        env:
          AUDIT_SECRET_KEY: ci-only-test-key-not-for-production
        run: |
          python - <<'PY'
          from agents.base import AuditLogger
          AuditLogger.log("ci", "test", "CHECK", {"status": "ok"})
          assert AuditLogger.verify_integrity()
          print("HMAC verification passed")
          PY

  browser:
    name: Browser scoring unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/score.js
      - run: node --test web/score.test.js
      - name: Check HTML script syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  self.in_script = tag == "script" and dict(attrs).get("type") == "module"
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.in_script = False
              def handle_data(self, data):
                  if self.in_script:
                      self.scripts.append(data)
          parser = Scripts()
          parser.feed(Path("web/index.html").read_text())
          assert parser.scripts
          Path("/tmp/timi-inline.mjs").write_text("\n".join(parser.scripts))
          PY
          node --check /tmp/timi-inline.mjs
